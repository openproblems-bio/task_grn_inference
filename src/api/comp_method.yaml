namespace: methods
info:
  type: method
  type_info:
    label: Method
    summary: A GRN inference method.
    description: |
      A method for inferring a GRN from expression data. It reads the
      normalization given by its `info.preferred_normalization`.
arguments:
  - name: --input_train
    __merge__: file_train.yaml
    required: true
    direction: input
  - name: --input_train_atac
    __merge__: file_train_atac.yaml
    required: false
    direction: input
  - name: --input_tf_all
    __merge__: file_tf_all.yaml
    required: true
    direction: input
  - name: --output
    __merge__: file_prediction.yaml
    required: true
    direction: output
  - name: --max_n_links
    type: integer
    default: 50000
  - name: --num_workers
    type: integer
    default: 2
  - name: --temp_dir
    type: string
    default: output/tempdir
  - name: --seed
    type: integer
    default: 32
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - type: python_script
    path: /common/component_tests/check_config.py
  - path: /resources_test/task_grn_inference
    dest: resources_test/task_grn_inference
