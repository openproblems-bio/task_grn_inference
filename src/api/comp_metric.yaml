namespace: metrics
info:
  type: metric
  type_info:
    label: Metric
    summary: A metric to evaluate the inferred GRN.
    description: |
      A metric for evaluating the performance of an inferred GRN. Metrics
      exit with code 99 when an input they need is missing.
arguments:
  - name: --input_prediction
    __merge__: file_prediction.yaml
    required: true
    direction: input
  - name: --input_solution
    __merge__: file_solution.yaml
    required: true
    direction: input
  - name: --input_solution_de
    __merge__: file_solution_de.yaml
    required: false
    direction: input
  - name: --input_solution_sc
    __merge__: file_solution_sc.yaml
    required: false
    direction: input
  - name: --input_tf_all
    __merge__: file_tf_all.yaml
    required: false
    direction: input
  - name: --input_consensus
    __merge__: file_consensus.yaml
    required: false
    direction: input
  - name: --input_ws_consensus
    __merge__: file_ws_consensus.yaml
    required: false
    direction: input
  - name: --input_ws_background
    __merge__: file_ws_background.yaml
    required: false
    direction: input
  - name: --input_ground_truth_unibind
    __merge__: file_ground_truth.yaml
    required: false
    direction: input
  - name: --input_ground_truth_chipatlas
    __merge__: file_ground_truth.yaml
    required: false
    direction: input
  - name: --input_ground_truth_remap
    __merge__: file_ground_truth.yaml
    required: false
    direction: input
  - name: --input_genesets
    __merge__: file_genesets.yaml
    required: false
    multiple: true
    direction: input
  - name: --output
    __merge__: file_score.yaml
    required: true
    direction: output
  - name: --max_n_links
    type: integer
    default: 50000
  - name: --num_workers
    type: integer
    default: 20
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - type: python_script
    path: /common/component_tests/check_config.py
  - path: /resources_test/task_grn_inference
    dest: resources_test/task_grn_inference
