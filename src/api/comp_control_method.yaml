namespace: control_methods
info:
  type: control_method
  type_info:
    label: Control Method
    summary: Controls for verifying the benchmark.
    description: |
      Same interface as the regular methods, plus the solution as input.
      They are either baselines expected to be outperformed by actual methods,
      or use evaluation data to yield a higher performance.
arguments:
  - name: --input_train
    __merge__: file_train.yaml
    required: true
    direction: input
  - name: --input_train_atac
    __merge__: file_train_atac.yaml
    required: false
    direction: input
  - name: --input_tf_all
    __merge__: file_tf_all.yaml
    required: true
    direction: input
  - name: --input_solution
    __merge__: file_solution.yaml
    required: false
    direction: input
  - name: --output
    __merge__: file_prediction.yaml
    required: true
    direction: output
  - name: --max_n_links
    type: integer
    default: 50000
  - name: --num_workers
    type: integer
    default: 2
  - name: --temp_dir
    type: string
    default: output/tempdir
  - name: --seed
    type: integer
    default: 32
test_resources:
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - type: python_script
    path: /common/component_tests/check_config.py
  - path: /resources_test/task_grn_inference
    dest: resources_test/task_grn_inference
